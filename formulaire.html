<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jour 18 : formulaire et validation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Formulaire et validation</h1></header>
  <main>
    <h2>Décris ton idée de scène</h2>

    <form id="form-idee" novalidate>
      <label for="auteur">Ton prénom</label><br>
      <input type="text" id="auteur" name="auteur" placeholder="Ex. Awa" required>
      <p class="erreur" id="erreur-auteur" aria-live="polite"></p>

      <label for="idee">Ton idée (3 à 100 caractères)</label><br>
      <input type="text" id="idee" name="idee" placeholder="Un jeune héros qui..." required>
      <p class="erreur" id="erreur-idee" aria-live="polite"></p>

      <button type="submit" id="btn-envoyer">Envoyer</button>
      <button type="reset" id="btn-effacer">Effacer</button>
    </form>

    <p id="succes" class="succes cache" aria-live="polite"></p>
    <p><a href="profil.html">Retour au profil</a></p>
  </main>
  <script src="js/jour18.js"></script>
</body>
</html>
